<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b5e4a">
<title>Çınar ERP — Mal Kabul</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#eef4f1; color:#1a1a1a; padding-bottom:78px; }
  header { background:#1b5e4a; color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.15); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:16px; font-weight:600; }
  .sync-dot { width:9px; height:9px; border-radius:50%; background:#ffb300; flex-shrink:0; }
  .sync-dot.ok { background:#76ff03; } .sync-dot.err { background:#ff5252; }
  .container { padding:16px; max-width:680px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:6px; margin-top:12px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; padding:13px; border:1.5px solid #ddd; border-radius:10px; font-size:16px; background:#fafafa; }
  input:focus, select:focus { outline:none; border-color:#1b5e4a; background:#fff; }
  .btn { width:100%; padding:15px; background:#1b5e4a; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; margin-top:16px; cursor:pointer; }
  .btn:active { background:#124434; }
  .btn:disabled { opacity:.5; }
  .parti { padding:14px; background:#fff; border-radius:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.05); cursor:pointer; border:2px solid transparent; }
  .parti.secili { border-color:#1b5e4a; background:#f0f9f5; }
  .parti .top { font-weight:600; font-size:15px; }
  .parti .sub { font-size:13px; color:#666; margin-top:3px; }
  .parti .meta { font-size:12px; color:#999; margin-top:2px; }
  .parti .pal { font-size:12px; color:#1b5e4a; font-weight:600; margin-top:4px; }
  .section-title { font-size:14px; font-weight:700; color:#444; margin:18px 0 10px 2px; }
  .section-title:first-child { margin-top:0; }
  .tabs { display:flex; background:#fff; border-top:1px solid #e5e5e5; position:fixed; bottom:0; left:0; right:0; z-index:10; }
  .tab { flex:1; padding:10px; text-align:center; font-size:11px; color:#999; cursor:pointer; }
  .tab.active { color:#1b5e4a; font-weight:600; }
  .tab .ico { font-size:20px; display:block; margin-bottom:1px; }
  .empty { text-align:center; color:#999; padding:30px 20px; font-size:14px; }
  .hidden { display:none; }
  .hint { font-size:12px; color:#888; margin-top:8px; line-height:1.4; }
  .palet-kart { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:#fff; border-radius:12px; margin-bottom:9px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .palet-kart .info { flex:1; min-width:0; }
  .palet-kart .pno { font-weight:600; font-size:14px; font-family:monospace; }
  .palet-kart .psub { font-size:12px; color:#888; margin-top:2px; }
  .durum-badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; background:#e0f2ec; color:#1b5e4a; }
  .yazdir-btn { background:#1b5e4a; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
  .del { background:#fde8e8; border:none; color:#d32f2f; font-size:15px; padding:8px 10px; border-radius:8px; cursor:pointer; margin-left:6px; }
  /* Etiket baskı alanı */
  #etiketAlan { display:none; }
  @media print {
    body * { visibility:hidden; }
    #etiketAlan, #etiketAlan * { visibility:visible; }
    #etiketAlan { display:block; position:absolute; left:0; top:0; width:100%; }
    .etiket { page-break-after:always; padding:8mm; border:1px solid #000; margin-bottom:4mm; }
  }
  .etiket { width:100%; max-width:340px; margin:0 auto 10px; border:1.5px dashed #999; border-radius:8px; padding:14px; text-align:center; background:#fff; }
  .etiket .firma { font-size:13px; font-weight:700; color:#1b5e4a; }
  .etiket .pno-b { font-size:20px; font-weight:700; font-family:monospace; margin:6px 0; }
  .etiket .satir { font-size:13px; margin:2px 0; }
  .etiket .qr { margin:10px auto; }
  #onizleme { margin-top:14px; }
</style>
</head>
<body>

<header>
  <h1>📦 Çınar ERP — Mal Kabul</h1>
  <div class="sync-dot" id="syncDot"></div>
</header>

<div class="container">

  <!-- PARTİLER -->
  <div id="view-parti">
    <div class="section-title">Kantar Giriş Partileri</div>
    <div class="hint" style="margin-top:0;margin-bottom:12px">Palet oluşturmak için bir parti seçin.</div>
    <div id="partiListe"></div>

    <div class="card hidden" id="paletOlusturKart">
      <div class="section-title">Palet Oluştur</div>
      <div id="seciliPartiBilgi" style="font-size:14px;color:#555;margin-bottom:8px"></div>
      <label>Kaç palet oluşturulsun?</label>
      <input type="number" id="paletAdet" inputmode="numeric" placeholder="Palet adedi" min="1">
      <button class="btn" id="btnOlustur">Paletleri Oluştur & Etiket Hazırla</button>
    </div>
  </div>

  <!-- PALETLER -->
  <div id="view-paletler" class="hidden">
    <div class="section-title">Oluşturulan Paletler</div>
    <div id="paletListe"></div>
    <div id="onizleme"></div>
  </div>

</div>

<!-- Yazdırma alanı -->
<div id="etiketAlan"></div>

<div class="tabs">
  <div class="tab active" data-tab="parti"><span class="ico">🚚</span>Partiler</div>
  <div class="tab" data-tab="paletler"><span class="ico">📦</span>Paletler</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://lpzasmhpwbnvrugajqcl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_N_UdhK5n-otBQzqCYczASw_49Z0Uut9';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let cache = { kunye:[], kantar:[], paletler:[] };
let seciliParti = null;

const dot = document.getElementById('syncDot');
function durum(s){ dot.className='sync-dot'+(s==='ok'?' ok':s==='err'?' err':''); }
function ad(id){ const x=cache.kunye.find(function(y){return y.id==id;}); return x?x.ad:'—'; }

async function cek(){
  try{
    const [ku, ka, pa] = await Promise.all([
      sb.from('kunye').select('*'),
      sb.from('kantar').select('*').eq('yon','giris'),
      sb.from('paletler').select('*')
    ]);
    if(ku.error||ka.error||pa.error){ console.error(ku.error||ka.error||pa.error); durum('err'); return; }
    cache.kunye = ku.data||[];
    cache.kantar = ka.data||[];
    cache.paletler = pa.data||[];
    durum('ok');
    partiListele(); paletListele();
  }catch(e){ console.error(e); durum('err'); }
}

// ---------- Partiler ----------
function partiPaletSayisi(kantarId){ return cache.paletler.filter(function(p){return p.kantar_id===kantarId;}).length; }

function partiListele(){
  const el = document.getElementById('partiListe');
  const arr = cache.kantar.slice().sort(function(a,b){return b.id-a.id;});
  if(arr.length===0){ el.innerHTML='<div class="empty">Henüz kantar giriş partisi yok.</div>'; return; }
  el.innerHTML = arr.map(function(k){
    const pSay = partiPaletSayisi(k.id);
    const tarih = new Date(k.tarih).toLocaleDateString('tr-TR')+' '+new Date(k.tarih).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    return '<div class="parti'+(seciliParti&&seciliParti.id===k.id?' secili':'')+'" data-parti="'+k.id+'">'
      +'<div class="top">'+ad(k.taraf_id)+' · '+ad(k.urun_id)+'</div>'
      +'<div class="sub">Net: <b>'+(k.net_kg||0).toFixed(1)+' kg</b>'+(k.plaka?' · '+k.plaka:'')+'</div>'
      +'<div class="meta">'+tarih+' · Parti #'+k.id+'</div>'
      +(pSay>0?'<div class="pal">✓ '+pSay+' palet oluşturuldu</div>':'')
      +'</div>';
  }).join('');
}

function partiSec(id){
  seciliParti = cache.kantar.find(function(k){return k.id===id;});
  partiListele();
  const kart = document.getElementById('paletOlusturKart');
  kart.classList.remove('hidden');
  document.getElementById('seciliPartiBilgi').innerHTML =
    '<b>'+ad(seciliParti.taraf_id)+'</b> · '+ad(seciliParti.urun_id)+' · '+(seciliParti.net_kg||0).toFixed(1)+' kg · Parti #'+seciliParti.id;
  document.getElementById('paletAdet').value='';
  kart.scrollIntoView({behavior:'smooth'});
}

// ---------- Palet oluştur ----------
async function paletOlustur(){
  if(!seciliParti){ alert('Önce parti seçin.'); return; }
  const adet = parseInt(document.getElementById('paletAdet').value)||0;
  if(adet<1){ alert('Geçerli palet adedi girin.'); return; }
  if(adet>200){ if(!confirm(adet+' palet oluşturulacak. Emin misiniz?')) return; }

  durum('wait');
  const yeniPaletler = [];
  const baseId = Date.now();
  for(let i=0;i<adet;i++){
    yeniPaletler.push({
      id: baseId + i,
      kantar_id: seciliParti.id,
      urun_id: seciliParti.urun_id,
      mustahsil_id: seciliParti.taraf_id,
      durum: 'OLUSTURULDU',
      olusturma_tarih: new Date().toISOString()
    });
  }
  const { error } = await sb.from('paletler').insert(yeniPaletler);
  if(error){ alert('HATA: '+error.message+'\n\nDetay: '+(error.details||'-')); durum('err'); console.error(error); return; }
  yeniPaletler.forEach(function(p){ cache.paletler.push(p); });
  durum('ok');
  partiListele();
  alert(adet+' palet oluşturuldu ✓\nEtiketler hazırlanıyor...');
  // etiketleri göster + yazdırmaya hazırla
  etiketleriHazirla(yeniPaletler);
  goster('paletler');
}

// ---------- Etiket / QR ----------
async function qrDataUrl(text){
  try { return await window.QRCode.toDataURL(text, {width:160, margin:1}); }
  catch(e){ console.error(e); return ''; }
}

async function etiketBir(p){
  const qrText = 'CINAR-PLT-'+p.id;
  const qr = await qrDataUrl(qrText);
  const tarih = new Date(p.olusturma_tarih).toLocaleDateString('tr-TR');
  return '<div class="etiket">'
    +'<div class="firma">ÇINAR PAKETLEME</div>'
    +'<div class="pno-b">PLT-'+p.id+'</div>'
    +(qr?'<img class="qr" src="'+qr+'" width="150" height="150">':'')
    +'<div class="satir"><b>Ürün:</b> '+ad(p.urun_id)+'</div>'
    +'<div class="satir"><b>Müstahsil:</b> '+ad(p.mustahsil_id)+'</div>'
    +'<div class="satir"><b>Parti:</b> #'+p.kantar_id+'</div>'
    +'<div class="satir"><b>Tarih:</b> '+tarih+'</div>'
    +'</div>';
}

async function etiketleriHazirla(paletler){
  const oniz = document.getElementById('onizleme');
  const bask = document.getElementById('etiketAlan');
  oniz.innerHTML = '<div class="section-title">Yeni Etiketler ('+paletler.length+' adet)</div>'
    +'<button class="btn" id="btnYazdir">🖨️ Etiketleri Yazdır</button><div id="onizIcerik" style="margin-top:12px"></div>';
  let html='';
  for(const p of paletler){ html += await etiketBir(p); }
  document.getElementById('onizIcerik').innerHTML = html;
  bask.innerHTML = html;
}

// ---------- Palet listesi ----------
function paletListele(){
  const el = document.getElementById('paletListe');
  const arr = cache.paletler.slice().sort(function(a,b){return b.id-a.id;}).slice(0,100);
  if(arr.length===0){ el.innerHTML='<div class="empty">Henüz palet yok.</div>'; return; }
  el.innerHTML = arr.map(function(p){
    return '<div class="palet-kart"><div class="info">'
      +'<div class="pno">PLT-'+p.id+'</div>'
      +'<div class="psub">'+ad(p.urun_id)+' · '+ad(p.mustahsil_id)+' · Parti #'+p.kantar_id+'</div>'
      +'</div>'
      +'<span class="durum-badge">'+p.durum+'</span>'
      +'<button class="yazdir-btn" data-yazdir="'+p.id+'" style="margin-left:6px">🖨️</button>'
      +'<button class="del" data-sil="'+p.id+'">🗑</button>'
      +'</div>';
  }).join('');
}

async function tekEtiketYazdir(id){
  const p = cache.paletler.find(function(x){return x.id===id;});
  if(!p) return;
  document.getElementById('etiketAlan').innerHTML = await etiketBir(p);
  window.print();
}

async function paletSil(id){
  if(!confirm('PLT-'+id+' silinsin mi?')) return;
  durum('wait');
  const { error } = await sb.from('paletler').delete().eq('id', id);
  if(error){ alert('Silinemedi.'); durum('err'); return; }
  cache.paletler = cache.paletler.filter(function(p){return p.id!==id;});
  durum('ok'); paletListele(); partiListele();
}

// ---------- Sekme + olaylar ----------
function goster(v){
  document.getElementById('view-parti').classList.toggle('hidden', v!=='parti');
  document.getElementById('view-paletler').classList.toggle('hidden', v!=='paletler');
  document.querySelectorAll('.tab').forEach(function(tb){ tb.classList.toggle('active', tb.getAttribute('data-tab')===v); });
  if(v==='parti') partiListele();
  else paletListele();
}

document.addEventListener('click', function(e){
  const pt = e.target.closest('[data-parti]'); if(pt){ partiSec(parseInt(pt.getAttribute('data-parti'))); return; }
  if(e.target.closest('#btnOlustur')){ paletOlustur(); return; }
  if(e.target.closest('#btnYazdir')){ window.print(); return; }
  const yz = e.target.closest('[data-yazdir]'); if(yz){ tekEtiketYazdir(parseInt(yz.getAttribute('data-yazdir'))); return; }
  const sl = e.target.closest('[data-sil]'); if(sl){ paletSil(parseInt(sl.getAttribute('data-sil'))); return; }
  const t = e.target.closest('[data-tab]'); if(t){ goster(t.getAttribute('data-tab')); return; }
});

durum('wait'); cek();
</script>
</body>
</html>
