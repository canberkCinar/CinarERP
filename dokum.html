<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5e1b4a">
<title>Çınar ERP — Döküm</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f4eef2; color:#1a1a1a; padding-bottom:78px; }
  header { background:#5e1b4a; color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.15); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:16px; font-weight:600; }
  .sync-dot { width:9px; height:9px; border-radius:50%; background:#ffb300; flex-shrink:0; }
  .sync-dot.ok { background:#76ff03; } .sync-dot.err { background:#ff5252; }
  .container { padding:14px; max-width:680px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:6px; margin-top:12px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; padding:13px; border:1.5px solid #ddd; border-radius:10px; font-size:16px; background:#fafafa; }
  input:focus, select:focus { outline:none; border-color:#5e1b4a; background:#fff; }
  .btn { width:100%; padding:15px; background:#5e1b4a; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; margin-top:12px; cursor:pointer; }
  .btn:active { background:#431336; }
  .btn:disabled { opacity:.5; }
  .btn-gri { background:#eee; color:#555; }
  .section-title { font-size:14px; font-weight:700; color:#444; margin:16px 0 10px 2px; }
  .section-title:first-child { margin-top:0; }
  .tabs { display:flex; background:#fff; border-top:1px solid #e5e5e5; position:fixed; bottom:0; left:0; right:0; z-index:10; }
  .tab { flex:1; padding:10px; text-align:center; font-size:11px; color:#999; cursor:pointer; }
  .tab.active { color:#5e1b4a; font-weight:600; }
  .tab .ico { font-size:20px; display:block; margin-bottom:1px; }
  .empty { text-align:center; color:#999; padding:30px 20px; font-size:14px; }
  .hidden { display:none; }
  .hint { font-size:12px; color:#888; margin-top:6px; line-height:1.4; }
  #reader { width:100%; border-radius:12px; overflow:hidden; margin-bottom:10px; }
  .okut-btn { display:flex; gap:8px; }
  .okut-btn button { flex:1; }
  .palet-bilgi { background:#faf4f8; border:1.5px solid #e5cfe0; border-radius:12px; padding:16px; margin-top:12px; }
  .palet-bilgi .pno { font-family:monospace; font-size:20px; font-weight:700; color:#5e1b4a; }
  .palet-bilgi .sat { font-size:14px; margin-top:6px; color:#444; }
  .palet-bilgi .durum { display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; margin-top:8px; }
  .d-olustur { background:#fff3e0; color:#b35900; }
  .d-makine { background:#e3f2fd; color:#1565c0; }
  .d-paket { background:#e8f5e9; color:#2e7d32; }
  .d-sevk { background:#ede7f6; color:#5e35b1; }
  .sonuc { padding:20px; border-radius:12px; text-align:center; margin-top:12px; }
  .sonuc.ok { background:#e8f5e9; color:#2e7d32; }
  .sonuc.hata { background:#ffebee; color:#c62828; }
  .sonuc .big { font-size:40px; }
  .sonuc .msg { font-size:15px; font-weight:600; margin-top:6px; }
  .kayit-satir { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:#fff; border-radius:12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .kayit-satir .pno { font-family:monospace; font-weight:600; font-size:14px; }
  .kayit-satir .sub { font-size:12px; color:#888; margin-top:2px; }
  .kayit-satir .mk { font-size:11px; font-weight:700; color:#1565c0; background:#e3f2fd; padding:3px 8px; border-radius:20px; }
  .ozet { display:flex; gap:8px; margin-bottom:12px; }
  .ozet .kutu { flex:1; background:#fff; border-radius:12px; padding:11px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .ozet .num { font-size:20px; font-weight:700; color:#5e1b4a; }
  .ozet .lbl { font-size:11px; color:#888; margin-top:2px; }
</style>
</head>
<body>

<header>
  <h1>⚙️ Çınar ERP — Döküm</h1>
  <div class="sync-dot" id="syncDot"></div>
</header>

<div class="container">

  <!-- OKUT -->
  <div id="view-okut">
    <div class="card">
      <label>Makine Seçin</label>
      <select id="f-makine"></select>
      <div class="hint">Okuttuğunuz paletler bu makineye gönderilir.</div>
    </div>

    <div class="card">
      <div class="section-title">Palet Okut</div>
      <div id="reader"></div>
      <div class="okut-btn">
        <button class="btn" id="btnKamera" style="margin-top:0">📷 Kamerayı Aç</button>
        <button class="btn btn-gri" id="btnKapat" style="margin-top:0; display:none">Kamerayı Kapat</button>
      </div>

      <label style="margin-top:16px">Veya Palet No Elle Gir</label>
      <div class="okut-btn">
        <input type="text" id="f-elle" inputmode="numeric" placeholder="PLT no (örn. 1783788560107)">
        <button class="btn" style="margin-top:0; max-width:100px" id="btnElle">Bul</button>
      </div>

      <div id="paletBilgiAlan"></div>
      <div id="sonucAlan"></div>
    </div>
  </div>

  <!-- KAYITLAR -->
  <div id="view-kayit" class="hidden">
    <div class="ozet">
      <div class="kutu"><div class="num" id="oz-bugun">0</div><div class="lbl">Bugün makineye</div></div>
      <div class="kutu"><div class="num" id="oz-bekle">0</div><div class="lbl">Bekleyen palet</div></div>
    </div>
    <div class="section-title">Bugün Makineye Gönderilenler</div>
    <div id="kayitListe"></div>
  </div>

</div>

<div class="tabs">
  <div class="tab active" data-tab="okut"><span class="ico">📷</span>Okut</div>
  <div class="tab" data-tab="kayit"><span class="ico">📋</span>Kayıtlar</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { Html5Qrcode } from 'https://esm.sh/html5-qrcode@2.3.8';
const SUPABASE_URL = 'https://lpzasmhpwbnvrugajqcl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_N_UdhK5n-otBQzqCYczASw_49Z0Uut9';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let cache = { kunye:[], paletler:[], makineler:[] };
let qrScanner = null;
let taraniyor = false;
let sonOkunan = 0;

const dot = document.getElementById('syncDot');
function durum(s){ dot.className='sync-dot'+(s==='ok'?' ok':s==='err'?' err':''); }
function ad(id){ const x=cache.kunye.find(function(y){return y.id==id;}); return x?x.ad:'—'; }
function bugun(){ return new Date().toISOString().split('T')[0]; }
function gunOf(t){ return (t||'').split('T')[0]; }

async function cek(){
  try{
    const [ku, pa, mk] = await Promise.all([
      sb.from('kunye').select('*'),
      sb.from('paletler').select('*'),
      sb.from('makineler').select('*').eq('aktif',true)
    ]);
    if(ku.error||pa.error||mk.error){ console.error(ku.error||pa.error||mk.error); durum('err'); return; }
    cache.kunye = ku.data||[];
    cache.paletler = pa.data||[];
    cache.makineler = mk.data||[];
    durum('ok');
    makineDoldur(); kayitListele();
  }catch(e){ console.error(e); durum('err'); }
}

function makineDoldur(){
  const sel = document.getElementById('f-makine');
  sel.innerHTML = cache.makineler.sort(function(a,b){return a.ad.localeCompare(b.ad,'tr');})
    .map(function(m){return '<option value="'+m.id+'">'+m.ad+'</option>';}).join('');
}

// ---------- QR / palet no çözümle ----------
function paletIdCoz(metin){
  // "CINAR-PLT-123" veya "123" veya "PLT-123"
  const m = (metin||'').match(/(\d{5,})/);
  return m ? parseInt(m[1]) : null;
}

function paletBul(id){
  return cache.paletler.find(function(p){return p.id===id;});
}

function paletGoster(id){
  const p = paletBul(id);
  const alan = document.getElementById('paletBilgiAlan');
  const sonuc = document.getElementById('sonucAlan');
  sonuc.innerHTML='';
  if(!p){
    alan.innerHTML='<div class="sonuc hata"><div class="big">❌</div><div class="msg">Palet bulunamadı: '+id+'</div></div>';
    return;
  }
  const durumClass = {OLUSTURULDU:'d-olustur',MAKINEDE:'d-makine',PAKETLENDI:'d-paket',SEVK:'d-sevk',PLANDA:'d-sevk'}[p.durum]||'d-olustur';
  let html = '<div class="palet-bilgi">'
    +'<div class="pno">PLT-'+p.id+'</div>'
    +'<div class="sat"><b>Ürün:</b> '+ad(p.urun_id)+'</div>'
    +'<div class="sat"><b>Müstahsil:</b> '+ad(p.mustahsil_id)+'</div>'
    +'<div class="sat"><b>Parti:</b> #'+p.kantar_id+'</div>'
    +'<div class="durum '+durumClass+'">'+p.durum+(p.makine_ad?' · '+p.makine_ad:'')+'</div>';
  if(p.durum==='OLUSTURULDU'){
    html += '<button class="btn" data-gonder="'+p.id+'">✓ Makineye Gönder</button>';
  } else if(p.durum==='MAKINEDE'){
    html += '<div class="hint" style="margin-top:10px">Bu palet zaten makinede ('+(p.makine_ad||'')+').</div>';
    html += '<button class="btn btn-gri" data-gonder="'+p.id+'">Makineyi Değiştir / Tekrar Gönder</button>';
  } else {
    html += '<div class="hint" style="margin-top:10px">Bu palet '+p.durum+' aşamasında, döküme uygun değil.</div>';
  }
  html += '</div>';
  alan.innerHTML = html;
}

async function makineyeGonder(id){
  const p = paletBul(id);
  if(!p) return;
  const makineId = parseInt(document.getElementById('f-makine').value);
  const makine = cache.makineler.find(function(m){return m.id===makineId;});
  if(!makine){ alert('Makine seçin.'); return; }
  durum('wait');
  const { error } = await sb.from('paletler').update({
    durum:'MAKINEDE', makine_id:makineId, makine_ad:makine.ad, makine_tarih:new Date().toISOString()
  }).eq('id', id);
  if(error){ alert('HATA: '+error.message); durum('err'); return; }
  p.durum='MAKINEDE'; p.makine_id=makineId; p.makine_ad=makine.ad; p.makine_tarih=new Date().toISOString();
  durum('ok');
  document.getElementById('paletBilgiAlan').innerHTML='';
  document.getElementById('sonucAlan').innerHTML='<div class="sonuc ok"><div class="big">✅</div><div class="msg">PLT-'+id+' → '+makine.ad+'</div></div>';
  document.getElementById('f-elle').value='';
  kayitListele();
  setTimeout(function(){ document.getElementById('sonucAlan').innerHTML=''; }, 2500);
}

// ---------- Kamera ----------
async function kameraAc(){
  document.getElementById('btnKamera').style.display='none';
  document.getElementById('btnKapat').style.display='block';
  qrScanner = new Html5Qrcode('reader');
  try{
    await qrScanner.start({ facingMode:'environment' }, { fps:10, qrbox:{width:220,height:220} },
      function(decoded){
        const id = paletIdCoz(decoded);
        if(id && id!==sonOkunan){
          sonOkunan = id;
          paletGoster(id);
          if(navigator.vibrate) navigator.vibrate(100);
          setTimeout(function(){ sonOkunan=0; }, 2000);
        }
      }, function(){});
    taraniyor=true;
  }catch(e){ alert('Kamera açılamadı: '+e); kameraKapat(); }
}
async function kameraKapat(){
  if(qrScanner && taraniyor){ try{ await qrScanner.stop(); qrScanner.clear(); }catch(e){} }
  taraniyor=false;
  document.getElementById('btnKamera').style.display='block';
  document.getElementById('btnKapat').style.display='none';
}

// ---------- Kayıtlar ----------
function kayitListele(){
  const today = bugun();
  const makinedeBugun = cache.paletler.filter(function(p){ return p.durum==='MAKINEDE' && gunOf(p.makine_tarih)===today; });
  const bekleyen = cache.paletler.filter(function(p){ return p.durum==='OLUSTURULDU'; });
  document.getElementById('oz-bugun').textContent = makinedeBugun.length;
  document.getElementById('oz-bekle').textContent = bekleyen.length;

  const el = document.getElementById('kayitListe');
  if(makinedeBugun.length===0){ el.innerHTML='<div class="empty">Bugün henüz makineye gönderilen yok.</div>'; return; }
  makinedeBugun.sort(function(a,b){ return new Date(b.makine_tarih)-new Date(a.makine_tarih); });
  el.innerHTML = makinedeBugun.map(function(p){
    const saat = new Date(p.makine_tarih).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    return '<div class="kayit-satir"><div><div class="pno">PLT-'+p.id+'</div>'
      +'<div class="sub">'+ad(p.urun_id)+' · '+saat+'</div></div>'
      +'<span class="mk">'+(p.makine_ad||'')+'</span></div>';
  }).join('');
}

// ---------- Olaylar ----------
document.addEventListener('click', function(e){
  if(e.target.closest('#btnKamera')){ kameraAc(); return; }
  if(e.target.closest('#btnKapat')){ kameraKapat(); return; }
  if(e.target.closest('#btnElle')){ const id=paletIdCoz(document.getElementById('f-elle').value); if(id) paletGoster(id); else alert('Geçerli palet no girin.'); return; }
  const g = e.target.closest('[data-gonder]'); if(g){ makineyeGonder(parseInt(g.getAttribute('data-gonder'))); return; }
  const t = e.target.closest('[data-tab]');
  if(t){ const v=t.getAttribute('data-tab');
    if(v!=='okut') kameraKapat();
    document.getElementById('view-okut').classList.toggle('hidden', v!=='okut');
    document.getElementById('view-kayit').classList.toggle('hidden', v!=='kayit');
    document.querySelectorAll('.tab').forEach(function(tb){ tb.classList.toggle('active', tb.getAttribute('data-tab')===v); });
    if(v==='kayit') kayitListele();
    return;
  }
});
document.getElementById('f-elle').addEventListener('keydown', function(e){ if(e.key==='Enter'){ const id=paletIdCoz(this.value); if(id) paletGoster(id); } });

durum('wait'); cek();
</script>
</body>
</html>
